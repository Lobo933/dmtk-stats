<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f0f4f8;color:#1a1a2e;font-size:14px}
header{background:#0A1F5C;color:white;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:1.15rem;font-weight:700;line-height:1.2}
header .season{color:#F5C400;font-size:0.8rem;margin-top:3px}
#langBtn{background:#F5C400;color:#0A1F5C;border:none;border-radius:6px;padding:8px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;white-space:nowrap;min-height:44px}
.container{max-width:1100px;margin:0 auto;padding:12px}
.stats-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.stat-box{background:white;border-radius:10px;padding:10px 12px;flex:1;min-width:90px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,0.08);border-top:3px solid #0A1F5C}
.stat-val{font-size:1.5rem;font-weight:700;color:#0A1F5C;line-height:1}
.stat-val.big{font-size:2rem}
.stat-lbl{font-size:0.65rem;color:#888;text-transform:uppercase;letter-spacing:0.04em;margin-top:4px}
.section{background:white;border-radius:10px;padding:14px 16px;margin-bottom:16px;box-shadow:0 2px 6px rgba(0,0,0,0.08)}
.section h2{font-size:0.85rem;font-weight:700;color:#0A1F5C;border-bottom:2px solid #F5C400;padding-bottom:5px;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.05em}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:0.78rem}
th{background:#0A1F5C;color:white;padding:0 5px;text-align:center;font-size:0.7rem;white-space:nowrap}
th.sortable{cursor:pointer;user-select:none;min-height:44px;height:44px;line-height:1.1;vertical-align:middle}
th.sortable:hover{background:#1a3a8c}
th.sort-asc::after{content:' ▲';font-size:0.6rem}
th.sort-desc::after{content:' ▼';font-size:0.6rem}
td{padding:5px 5px;text-align:center;border-bottom:1px solid #eee;white-space:nowrap}
td:nth-child(2){text-align:left;min-width:80px}
td:nth-child(3){text-align:left}
th:nth-child(1),th:nth-child(2){position:sticky;z-index:3;background:#0A1F5C}
th:nth-child(1){left:0;min-width:28px}
th:nth-child(2){left:28px;min-width:80px}
td:nth-child(1),td:nth-child(2){position:sticky;z-index:2;background:#fff}
td:nth-child(1){left:0;min-width:28px}
td:nth-child(2){left:28px;min-width:80px}
tr.win td:nth-child(1),tr.win td:nth-child(2){background:#e8f5e9}
tr.loss td:nth-child(1),tr.loss td:nth-child(2){background:#ffeaea}
tr.top3 td:nth-child(1),tr.top3 td:nth-child(2){background:#fff8e1}
tr:hover td{background:#f0f4ff!important}
tr.win td{background:#e8f5e9}
tr.loss td{background:#ffeaea}
tr.top3 td{background:#fff8e1;font-weight:600}
.leaders{display:flex;gap:8px;flex-wrap:wrap}
.leader-card{background:#f0f4ff;border-radius:8px;padding:10px 12px;flex:1;min-width:120px;border-left:3px solid #0A1F5C}
.leader-cat{font-size:0.65rem;color:#888;text-transform:uppercase;letter-spacing:0.04em}
.leader-name{font-size:0.95rem;font-weight:700;color:#0A1F5C;margin:3px 0}
.leader-val{font-size:0.85rem;color:#F5C400;background:#0A1F5C;display:inline-block;padding:2px 7px;border-radius:4px}
.chart-wrap{position:relative;height:200px}
.footnote{font-size:0.68rem;color:#888;margin-top:8px;line-height:1.5}
.footnote b{color:#555}
.warn{font-size:0.68rem;color:#b22222;margin-top:4px;line-height:1.5}
.updated{font-size:0.65rem;color:#aaa;text-align:right;margin-top:6px}
footer{background:#0A1F5C;text-align:center;font-size:0.65rem;color:rgba(255,255,255,0.3);padding:16px;line-height:1.8}
.last-game{background:#0A1F5C;color:white;padding:10px 16px;margin:12px 0 4px;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:0.85rem}
.last-game .lg-label{font-size:0.65rem;color:#F5C400;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:2px}
.last-game .lg-score{font-size:1.4rem;font-weight:800;letter-spacing:-0.01em}
.last-game .lg-result{font-size:0.75rem;font-weight:700;padding:3px 10px;border-radius:5px}
.last-game .lg-result.win{background:#4caf50;color:white}
.last-game .lg-result.loss{background:#e53935;color:white}
.next-game{background:linear-gradient(90deg,#c9a000,#F5C400);color:#0A1F5C;padding:10px 16px;margin:12px 0 4px;border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:0.85rem}
.next-game .ng-label{font-size:0.65rem;color:#0A1F5C;opacity:0.7;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:2px;font-weight:700}
.next-game .ng-match{font-size:0.95rem;font-weight:800;line-height:1.25}
.next-game .ng-meta{font-size:0.72rem;opacity:0.85;margin-top:2px}
.next-game .ng-ha{font-size:0.7rem;font-weight:800;padding:3px 10px;border-radius:5px;background:#0A1F5C;color:#F5C400;white-space:nowrap}
td.trend-up{color:#2e7d32;font-weight:700}
td.trend-dn{color:#c62828;font-weight:700}
@media(max-width:480px){
  .stats-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat-box{min-width:0;padding:8px}
  .stat-val{font-size:1.2rem}
  .stat-val.big{font-size:1.6rem}
  .leader-card{min-width:100px}
}
/* ── Box score modal ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;align-items:center;justify-content:center;padding:12px}
.modal-overlay.open{display:flex}
.modal{background:white;border-radius:12px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.25)}
.modal-header{background:#0A1F5C;color:white;padding:14px 16px;border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:1rem;font-weight:700}
.modal-header .modal-score{font-size:1.1rem;font-weight:700;color:#F5C400}
.modal-close{background:none;border:none;color:white;font-size:1.4rem;cursor:pointer;line-height:1;padding:0 4px}
.modal-body{padding:12px}
.modal-body table{width:100%;border-collapse:collapse;font-size:0.82rem}
.modal-body th{background:#f0f4f8;color:#555;font-weight:600;padding:6px 8px;text-align:center;position:sticky;top:0}
.modal-body th:first-child{text-align:left}
.modal-body td{padding:5px 8px;border-bottom:1px solid #f0f0f0;text-align:center}
.modal-body td:first-child{text-align:left;font-weight:600}
.modal-body tr:last-child td{border-bottom:none}
tr.game-clickable{cursor:pointer}
tr.game-clickable:hover td{background:#f5f8ff !important}
</style>
</head>

    player_cols: ["#","Player","GP","MPG","+/- tot","+/- avg","PIR tot","PIR avg","PPG","RPG","APG","SPG","BPG","TO","FG%","3P%","Trend"],
    player_cols_adv: ["#","Player","P40","AST/TO","PPS","Usg%*","ORtg*","eFG%","TS%"],
    adv_title: "Advanced Stats — sorted by ORtg*",
    game_cols:   ["#","Date","Opponent","Score","W/L","FG%","3P%","FT%","AST","TO","REB"],
    bs_cols:  ["Player","Time","PTS","REB","AST","STL","BLK","PIR","+/-"],
    no_bs_data: "No box score data for this game.",
    fn_pir: "The table is sorted by <b>PIR</b> (Performance Index Rating) — European basketball's official all-round performance stat. Everything positive adds up (points, rebounds, assists, steals, blocks) and everything negative is subtracted (turnovers, missed shots, fouls). The higher the number, the more the player contributed to the game.",
    fn_pm: "+/− can be skewed over a small sample.",
    generated: "Generated:",
    dmtk_label: "DMTK",
    opp_label: "Opponent",
    abbrev_legend: "Abbreviations: GP = games played · MPG = minutes per game · PPG = points per game · RPG = rebounds per game · APG = assists per game · SPG = steals per game · BPG = blocks per game · TO = turnovers per game · FG% = field goal % · 3P% = three-point %",
    abbrev_legend_adv: "Advanced stats: P40 = points per 40 min · AST/TO = assist-to-turnover ratio · PPS = points per field-goal attempt · eFG% = effective FG% (weights 3-pointers at 1.5×) · TS% = true shooting % — pts ÷ (2 × (FGA + 0.44 × FTA)) · Usg%* = share of team possessions used · ORtg* = approx. individual offensive rating (pts per 100 possessions) · * = approximation",
    schedule_title: "Upcoming Games",
    schedule_cols: ["Date","Time","Home","Away","Venue"],
    schedule_home: "H",
    schedule_away: "A",
    schedule_src: "Source: mkosz.hu · updated: 2026-11-06",  // date baked in at build time
    standings_title: "Standings",
    standings_cols: ["#","Team","GP","W","L","+/-","Pts"],
    standings_note: "The CEKK and Szolnoki games were qualifying fixtures and don't count toward the league standings.",
    standings_src: "Source: mkosz.hu",
    last_game_label: "Last Game",
    next_game_label: "Next Game",
    next_home: "Home",
    next_away: "Away",
    trend_label: "Trend",
    trend_tip: "Last 3 games PPG vs season average",
  }
};

// ── State ─────────────────────────────────────────────────────────────────────
let lang = localStorage.getItem('dmtk_lang') || 'hu';
let chartInstance = null;
let playerSortCol = -1, playerSortAsc = true;
let playerAdvSortCol = -1, playerAdvSortAsc = false;

// ── Render helpers ────────────────────────────────────────────────────────────
function renderHero() {
  const t = T[lang];
  const keys = ['record','games','pts_for','pts_ag','margin','streak','fg','efg','poss_g','ortg','drtg'];
  const vals = [HERO.record,HERO.games,HERO.pts_for,HERO.pts_ag,HERO.margin,HERO.streak,HERO.fg,HERO.efg,HERO.poss_g,HERO.ortg,HERO.drtg];
  document.getElementById('heroRow').innerHTML = keys.map((k,i) =>
    `<div class="stat-box"><div class="stat-val${k==='record'?' big':''}">${vals[i]}</div><div class="stat-lbl">${t[k]}</div></div>`
  ).join('');
}

function renderLastGame() {
  const t = T[lang];
  const el = document.getElementById('lastGameBanner');
  if (!LAST_GAME) { el.innerHTML = ''; return; }
  const cls = LAST_GAME.win ? 'win' : 'loss';
  const wl  = LAST_GAME.win ? t.wl[0] : t.wl[1];
  el.innerHTML = `<div class="last-game">
    <div><div class="lg-label">${t.last_game_label}</div><div style="font-size:0.9rem">${LAST_GAME.date} · ${LAST_GAME.opponent}</div></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="lg-score">${LAST_GAME.score}</div>
      <div class="lg-result ${cls}">${wl}</div>
    </div>
  </div>`;
}

function renderNextGame() {
  const t = T[lang];
  const el = document.getElementById('nextGameBanner');
  if (!el) return;
  // Find the first scheduled game on or after today (build date is a safe "today").
  const today = GENERATED.slice(0,10);
  const upcoming = (SCHEDULE || []).filter(r => r.date >= today).sort((a,b)=>a.date.localeCompare(b.date));
  if (!upcoming.length) { el.innerHTML = ''; return; }
  const g = upcoming[0];
  const isHome = g.home === 'DMTK';
  const opp    = isHome ? g.away : g.home;
  const date   = g.date.slice(5).replace(/-/g,'.') + '.';
  const venue  = g.venue ? ` · ${g.venue}` : '';
  const ha     = isHome ? t.next_home : t.next_away;
  el.innerHTML = `<div class="next-game">
    <div>
      <div class="ng-label">${t.next_game_label}</div>
      <div class="ng-match">DMTK vs ${opp}</div>
      <div class="ng-meta">${date} ${g.time}${venue}</div>
    </div>
    <div class="ng-ha">${ha}</div>
  </div>`;
}

function renderLeaders() {
  const t = T[lang];
  document.getElementById('leadersRow').innerHTML = LEADERS.map(l =>
    `<div class="leader-card"><div class="leader-cat">${lang==='hu'?l.hu:l.en}</div><div class="leader-name">${l.name}</div><div class="leader-val">${l.val}</div></div>`
  ).join('') || "<p style='color:#aaa'>—</p>";
}

function renderPlayerTable() {
  const t = T[lang];
  const cols = t.player_cols;
  document.getElementById('playerHead').innerHTML = cols.map((c,i) =>
    `<th class="sortable" onclick="sortTable('player',${i})">${c}</th>`
  ).join('');
  document.getElementById('playerBody').innerHTML = PLAYER_ROWS.map(r => {
    const cls = r.top3 ? 'top3' : '';
    const cells = r.cells.map((c,i) => {
      // Last column is trend — color it based on arrow direction
      if (i === r.cells.length - 1) {
        const tc = c.startsWith('↑') ? 'trend-up' : c.startsWith('↓') ? 'trend-dn' : '';
        return `<td class="${tc}" title="${T[lang].trend_tip}">${c}</td>`;
      }
      return `<td>${c}</td>`;
    });
    return `<tr class="${cls}">${cells.join('')}</tr>`;
  }).join('');
  const acols = t.player_cols_adv;
  document.getElementById('playerAdvHead').innerHTML = acols.map((c,i) =>
    `<th class="sortable" onclick="sortTable('playerAdv',${i})">${c}</th>`
  ).join('');
  document.getElementById('playerAdvBody').innerHTML = PLAYER_ROWS.map(r => {
    const cls = r.top3 ? 'top3' : '';
    return `<tr class="${cls}">${r.adv.map(c=>`<td>${c}</td>`).join('')}</tr>`;
  }).join('');
  document.getElementById('fnPlayers').innerHTML = t.fn_pir;
  document.getElementById('fnPM').innerHTML      = t.fn_pm;
  document.getElementById('fnAbbrev').textContent    = t.abbrev_legend;
  document.getElementById('fnAbbrevAdv').textContent = t.abbrev_legend_adv;
  restoreSort('player');
  sortTable('playerAdv', 6);
}

function renderGameTable() {
  const t = T[lang];
  const wl = t.wl;
  document.getElementById('gameHead').innerHTML = t.game_cols.map(c =>
    `<th>${c}</th>`
  ).join('');
  document.getElementById('gameBody').innerHTML = GAME_ROWS.map(r => {
    const cls = r.win ? 'win' : 'loss';
    const cells = [...r.cells];
    cells[4] = r.win ? wl[0] : wl[1];
    return `<tr class="${cls} game-clickable" onclick="openBsModal(${r.idx},this)">${cells.map(c=>`<td>${c}</td>`).join('')}</tr>`;
  }).join('');
}

function openBsModal(idx, tr) {
  const t = T[lang];
  const cells = Array.from(tr.querySelectorAll('td')).map(td => td.textContent);
  const date = cells[1], opponent = cells[2], score = cells[3];
  const win = tr.classList.contains('win');
  document.getElementById('bsTitle').textContent = opponent;
  document.getElementById('bsSubtitle').textContent = date + ' · ' + score;
  const scoreEl = document.getElementById('bsScore');
  scoreEl.textContent = win ? (t.wl[0]) : (t.wl[1]);
  scoreEl.style.background = win ? '#2e7d32' : '#c62828';
  scoreEl.style.padding = '3px 9px';
  scoreEl.style.borderRadius = '5px';
  scoreEl.style.fontSize = '0.8rem';
  scoreEl.style.color = 'white';
  scoreEl.style.fontWeight = '700';
  const bs = GAME_BS[idx] || [];
  const cols = t.bs_cols;
  document.getElementById('bsHead').innerHTML =
    `<tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>`;
  document.getElementById('bsBody').innerHTML = bs.length
    ? bs.map(r => `<tr>
        <td>${r.jersey ? '#'+r.jersey+' ' : ''}${r.name}</td>
        <td>${r.tim}</td>
        <td>${r.pts}</td>
        <td>${r.reb}</td>
        <td>${r.ast}</td>
        <td>${r.stl}</td>
        <td>${r.blk}</td>
        <td>${r.pir}</td>
        <td>${typeof r.pm==='number' && r.pm>0 ? '+'+r.pm : r.pm}</td>
      </tr>`).join('')
    : `<tr><td colspan="${cols.length}" style="text-align:center;padding:16px;color:#888">${t.no_bs_data}</td></tr>`;
  document.getElementById('bsModal').classList.add('open');
}

function closeBsModal(e) {
  if (e.target === document.getElementById('bsModal'))
    document.getElementById('bsModal').classList.remove('open');
}

function renderStandings() {
  const t = T[lang];
  const head = document.getElementById('standingsHead');
  if (!head || !STANDINGS) return;  // section only present when standings exist
  head.innerHTML = t.standings_cols.map((c,i) =>
    `<th style="${i===1?'text-align:left':''}">${c}</th>`).join('');
  document.getElementById('standingsBody').innerHTML = STANDINGS.table.map((r,i) => {
    const isDmtk = r.team.toLowerCase().includes('dunaharaszti') || r.team.toLowerCase().includes('dmtk');
    const diff = r.pf - r.pa;
    const diffStr = diff > 0 ? '+'+diff : ''+diff;
    const style = isDmtk ? 'background:#fff8e1;font-weight:700' : '';
    return `<tr style="${style}">
      <td>${i+1}</td>
      <td style="text-align:left">${r.team}</td>
      <td>${r.gp}</td>
      <td>${r.w}</td>
      <td>${r.l}</td>
      <td>${diffStr}</td>
      <td>${r.pts}</td>
    </tr>`;
  }).join('');
  const note = document.getElementById('standingsNote');
  if (note) note.textContent = t.standings_note;
  const src = document.getElementById('standingsSrc');
  if (src) src.innerHTML = `<a href="${STANDINGS.source_url}" target="_blank" rel="noopener" style="color:#0A1F5C">${t.standings_src}</a>`;
}

function renderSchedule() {
  const t = T[lang];
  const head = document.getElementById('scheduleHead');
  if (!head) return;  // archive dashboards omit the schedule section
  head.innerHTML =
    t.schedule_cols.map(c => `<th>${c}</th>`).join('');
  document.getElementById('scheduleBody').innerHTML = SCHEDULE.map(r => {
    const isHome = r.home === 'DMTK';
    const venue  = r.venue || '—';  // U18 schedule entries may have empty venue strings
    const badge  = `<span style="font-size:0.65rem;font-weight:700;padding:1px 5px;border-radius:3px;background:${isHome?'#0A1F5C':'#e0e0e0'};color:${isHome?'white':'#555'}">${isHome ? t.schedule_home : t.schedule_away}</span>`;
    const homeCell = isHome ? `<b>DMTK</b>` : r.home;
    const awayCell = isHome ? r.away : `<b>DMTK</b>`;
    return `<tr><td>${r.date.slice(5).replace(/-/g,'.') + '.'}</td><td>${r.time}</td><td style="text-align:left">${homeCell} ${isHome?badge:''}</td><td style="text-align:left">${awayCell} ${!isHome?badge:''}</td><td style="text-align:left;color:#666;font-size:0.75rem">${venue}</td></tr>`;
  }).join('');
  document.getElementById('scheduleSrc').textContent = t.schedule_src;
}

function renderAll() {
  document.getElementById('langBtn').textContent = T[lang].lang_toggle;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (T[lang][key]) el.textContent = T[lang][key];
  });
  renderHero();
  renderNextGame();
  renderLastGame();
  renderLeaders();
  renderPlayerTable();
  renderGameTable();
  renderStandings();
  renderSchedule();
  document.getElementById('generated').textContent = T[lang].generated + ' ' + GENERATED;
  renderChart();
}

function toggleLang() {
  lang = lang==='hu' ? 'en' : 'hu';
  localStorage.setItem('dmtk_lang', lang);
  renderAll();
}

// ── Chart ─────────────────────────────────────────────────────────────────────
function renderChart() {
  const t = T[lang];
  const labels  = GAME_ROWS.map(r => r.cells[1] + ' ' + r.cells[2]);
  const dmtk    = GAME_ROWS.map(r => parseInt(r.cells[3].split('–')[0])||0);
  const opp     = GAME_ROWS.map(r => parseInt(r.cells[3].split('–')[1])||0);
  const dmtkClr = GAME_ROWS.map(r => r.win ? 'rgba(46,125,50,0.85)' : 'rgba(198,40,40,0.85)');
  const ctx     = document.getElementById('scoreChart').getContext('2d');
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: t.dmtk_label, data: dmtk, backgroundColor: dmtkClr, borderRadius: 4 },
        { label: t.opp_label,  data: opp,  backgroundColor: 'rgba(245,196,0,0.85)', borderRadius: 4 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { font: { size: 11 } } } },
      scales: {
        x: { ticks: { font: { size: 10 }, maxRotation: 30 } },
        y: { beginAtZero: true, ticks: { stepSize: 10, font: { size: 10 } } }
      }
    }
  });
}

// ── Sortable tables ───────────────────────────────────────────────────────────
function sortTable(which, col) {
  let asc;
  if (which==='player') {
    asc = (col===playerSortCol) ? !playerSortAsc : (col<=1 ? true : false);
    playerSortCol=col; playerSortAsc=asc;
  } else {
    asc = (col===playerAdvSortCol) ? !playerAdvSortAsc : (col<=1 ? true : false);
    playerAdvSortCol=col; playerAdvSortAsc=asc;
  }
  const bodyId = which==='player' ? 'playerBody' : 'playerAdvBody';
  const headId = which==='player' ? 'playerHead' : 'playerAdvHead';
  const tbody  = document.getElementById(bodyId);
  const ths    = document.getElementById(headId).querySelectorAll('th');
  ths.forEach(t => t.classList.remove('sort-asc','sort-desc'));
  ths[col].classList.add(asc ? 'sort-asc' : 'sort-desc');
  const rows = Array.from(tbody.querySelectorAll('tr'));
  rows.sort((a,b) => {
    const av = a.cells[col] ? a.cells[col].textContent.trim() : '';
    const bv = b.cells[col] ? b.cells[col].textContent.trim() : '';
    const an = parseFloat(av.replace(/[%+—★]/g,''));
    const bn = parseFloat(bv.replace(/[%+—★]/g,''));
    if (!isNaN(an) && !isNaN(bn)) return asc ? an-bn : bn-an;
    return asc ? av.localeCompare(bv,'hu') : bv.localeCompare(av,'hu');
  });
  rows.forEach(r => tbody.appendChild(r));
  if (which==='player' || which==='playerAdv') {
    const allRows = Array.from(tbody.querySelectorAll('tr'));
    allRows.forEach((r,i) => {
      r.classList.remove('top3');
      if (i < 3) r.classList.add('top3');
    });
  }
}

function restoreSort(which) {
  let col, asc, headId;
  if (which==='player') {
    col=playerSortCol; asc=playerSortAsc; headId='playerHead';
  } else {
    col=playerAdvSortCol; asc=playerAdvSortAsc; headId='playerAdvHead';
  }
  if (col < 0) return;
  const ths = document.getElementById(headId).querySelectorAll('th');
  ths.forEach(t => t.classList.remove('sort-asc','sort-desc'));
  if (ths[col]) ths[col].classList.add(asc ? 'sort-asc' : 'sort-desc');
}

// ── Init ──────────────────────────────────────────────────────────────────────
renderAll();
</script>
</body>
</html>
