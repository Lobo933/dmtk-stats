<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMTK U16 — 2026–27</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f0f4f8;color:#1a1a2e;font-size:14px}
header{background:#0A1F5C;color:white;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:1.15rem;font-weight:700;line-height:1.2}
header .season{color:#F5C400;font-size:0.8rem;margin-top:3px}
#langBtn{background:#F5C400;color:#0A1F5C;border:none;border-radius:6px;padding:8px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;white-space:nowrap;min-height:44px}
.container{max-width:1100px;margin:0 auto;padding:12px}
.stats-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.stat-box{background:white;border-radius:10px;padding:10px 12px;flex:1;min-width:90px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,0.08);border-top:3px solid #0A1F5C}
.stat-val{font-size:1.5rem;font-weight:700;color:#0A1F5C;line-height:1}
.stat-val.big{font-size:2rem}
.stat-lbl{font-size:0.65rem;color:#888;text-transform:uppercase;letter-spacing:0.04em;margin-top:4px}
.section{background:white;border-radius:10px;padding:14px 16px;margin-bottom:16px;box-shadow:0 2px 6px rgba(0,0,0,0.08)}
.section h2{font-size:0.85rem;font-weight:700;color:#0A1F5C;border-bottom:2px solid #F5C400;padding-bottom:5px;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.05em}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:0.78rem}
th{background:#0A1F5C;color:white;padding:0 5px;text-align:center;font-size:0.7rem;white-space:nowrap}
th.sortable{cursor:pointer;user-select:none;min-height:44px;height:44px;line-height:1.1;vertical-align:middle}
th.sortable:hover{background:#1a3a8c}
th.sort-asc::after{content:' ▲';font-size:0.6rem}
th.sort-desc::after{content:' ▼';font-size:0.6rem}
td{padding:5px 5px;text-align:center;border-bottom:1px solid #eee;white-space:nowrap}
td:nth-child(2){text-align:left;min-width:80px}
td:nth-child(3){text-align:left}
th:nth-child(1),td:nth-child(1){position:sticky;left:0;z-index:2;background:inherit;min-width:28px}
th:nth-child(2),td:nth-child(2){position:sticky;left:28px;z-index:2;background:inherit;min-width:80px}
tr:hover td{background:#f0f4ff!important}
tr.win td{background:#e8f5e9}
tr.loss td{background:#ffeaea}
tr.top3 td{background:#fff8e1;font-weight:600}
.leaders{display:flex;gap:8px;flex-wrap:wrap}
.leader-card{background:#f0f4ff;border-radius:8px;padding:10px 12px;flex:1;min-width:120px;border-left:3px solid #0A1F5C}
.leader-cat{font-size:0.65rem;color:#888;text-transform:uppercase;letter-spacing:0.04em}
.leader-name{font-size:0.95rem;font-weight:700;color:#0A1F5C;margin:3px 0}
.leader-val{font-size:0.85rem;color:#F5C400;background:#0A1F5C;display:inline-block;padding:2px 7px;border-radius:4px}
.chart-wrap{position:relative;height:200px}
.footnote{font-size:0.68rem;color:#888;margin-top:8px;line-height:1.5}
.footnote b{color:#555}
.warn{font-size:0.68rem;color:#b22222;margin-top:4px;line-height:1.5}
.updated{font-size:0.65rem;color:#aaa;text-align:right;margin-top:6px}
@media(max-width:480px){
  .stat-box{min-width:80px;padding:8px}
  .stat-val{font-size:1.2rem}
  .stat-val.big{font-size:1.6rem}
  .leader-card{min-width:100px}
}
</style>

function renderHero() {
  const t = T[lang];

  const vals = [HERO.record,HERO.games,HERO.pts_for,HERO.pts_ag,HERO.margin,HERO.streak,HERO.fg,HERO.efg,HERO.poss_g,HERO.ortg];

function renderLeaders() {

function renderPlayerTable() {

  ).join('');

    const cls = r.top3 ? 'top3' : '';
    return `<tr class="${cls}">${r.cells.map(c=>`<td>${c}</td>`).join('')}</tr>`;

    const cls = r.top3 ? 'top3' : '';

function renderGameTable() {

// ── Chart ─────────────────────────────────────────────────────────────────────
function renderChart() {
  const t = T[lang];
  const labels = GAME_ROWS.map(r => r.cells[1] + ' ' + r.cells[2]);
  const dmtk   = GAME_ROWS.map(r => parseInt(r.cells[3].split('–')[0])||0);
  const opp    = GAME_ROWS.map(r => parseInt(r.cells[3].split('–')[1])||0);
  const ctx    = document.getElementById('scoreChart').getContext('2d');
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: t.dmtk_label, data: dmtk, backgroundColor: 'rgba(10,31,92,0.85)', borderRadius: 4 },
        { label: t.opp_label,  data: opp,  backgroundColor: 'rgba(245,196,0,0.85)', borderRadius: 4 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'top', labels: { font: { size: 11 } } } },
      scales: {
        x: { ticks: { font: { size: 10 }, maxRotation: 30 } },
        y: { beginAtZero: true, ticks: { stepSize: 10, font: { size: 10 } } }
      }
    }
  });
}

// ── Sortable tables ───────────────────────────────────────────────────────────
function sortTable(which, col) {
  let asc;
  if (which==='player') {
    asc = (col===playerSortCol) ? !playerSortAsc : (col<=1 ? true : false);
    playerSortCol=col; playerSortAsc=asc;
  } else if (which==='playerAdv') {
    asc = (col===playerAdvSortCol) ? !playerAdvSortAsc : (col<=1 ? true : false);
    playerAdvSortCol=col; playerAdvSortAsc=asc;
  } else {
    asc = (col===gameSortCol) ? !gameSortAsc : true;
    gameSortCol=col; gameSortAsc=asc;
  }
  const bodyId = which==='player' ? 'playerBody' : which==='playerAdv' ? 'playerAdvBody' : 'gameBody';
  const headId = which==='player' ? 'playerHead' : which==='playerAdv' ? 'playerAdvHead' : 'gameHead';
  const tbody  = document.getElementById(bodyId);
  const ths    = document.getElementById(headId).querySelectorAll('th');
  ths.forEach(t => t.classList.remove('sort-asc','sort-desc'));
  ths[col].classList.add(asc ? 'sort-asc' : 'sort-desc');
  const rows = Array.from(tbody.querySelectorAll('tr'));
  rows.sort((a,b) => {
    const av = a.cells[col] ? a.cells[col].textContent.trim() : '';
    const bv = b.cells[col] ? b.cells[col].textContent.trim() : '';
    const an = parseFloat(av.replace(/[%+—★]/g,''));
    const bn = parseFloat(bv.replace(/[%+—★]/g,''));
    if (!isNaN(an) && !isNaN(bn)) return asc ? an-bn : bn-an;
    return asc ? av.localeCompare(bv,'hu') : bv.localeCompare(av,'hu');
  });
  rows.forEach(r => tbody.appendChild(r));
  if (which==='player' || which==='playerAdv') {
    const allRows = Array.from(tbody.querySelectorAll('tr'));
    allRows.forEach((r,i) => {
      r.classList.remove('top3');
      if (i < 3) r.classList.add('top3');
    });
  }
}

function restoreSort(which) {
  let col, asc, headId;
  if (which==='player') {
    col=playerSortCol; asc=playerSortAsc; headId='playerHead';
  } else if (which==='playerAdv') {
    col=playerAdvSortCol; asc=playerAdvSortAsc; headId='playerAdvHead';
  } else {
    col=gameSortCol; asc=gameSortAsc; headId='gameHead';
  }
  if (col < 0) return;
  const ths = document.getElementById(headId).querySelectorAll('th');
  ths.forEach(t => t.classList.remove('sort-asc','sort-desc'));
  if (ths[col]) ths[col].classList.add(asc ? 'sort-asc' : 'sort-desc');
}
